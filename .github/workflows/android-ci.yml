name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate and verify release SBOM
        run: >-
          ./gradlew --no-daemon --stacktrace
          verifySbom testSbomValidation

      - name: Build and verify freeDebug
        run: >-
          ./gradlew --no-daemon --stacktrace
          :mimi-app:testFreeDebugUnitTest
          :mimi-app:lintFreeDebug
          :mimi-app:assembleFreeDebug

      - name: Build minified release artifacts
        run: >-
          ./gradlew --no-daemon --stacktrace
          :mimi-app:assembleFreeRelease
          :mimi-app:bundleFreeRelease

      - name: Generate release checksums
        run: >-
          sha256sum
          mimi-app/build/outputs/apk/free/release/*.apk
          mimi-app/build/outputs/bundle/freeRelease/*.aab
          > mimi-app/build/outputs/release-checksums.txt

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports-${{ github.sha }}
          path: |
            mimi-app/build/reports/
            chanlib/build/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload freeDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: mimi-reader-free-debug-${{ github.sha }}
          path: mimi-app/build/outputs/apk/free/debug/mimi-app-free-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release SBOM and dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mimi-reader-sbom-${{ github.sha }}
          path: |
            build/reports/sbom/*.json
            sbom/manual-components.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned freeRelease artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mimi-reader-free-release-unsigned-${{ github.sha }}
          path: |
            mimi-app/build/outputs/apk/free/release/*.apk
            mimi-app/build/outputs/bundle/freeRelease/*.aab
            mimi-app/build/outputs/mapping/freeRelease/mapping.txt
            mimi-app/build/outputs/release-checksums.txt
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests (Android ${{ matrix.android_version }}, API ${{ matrix.api_level }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_version: 10
            api_level: 29
          - android_version: 12
            api_level: 31
          - android_version: 14
            api_level: 34
          - android_version: 16
            api_level: 36

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api_level }}
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          script: ./gradlew --no-daemon --stacktrace :mimi-app:connectedFreeDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-api-${{ matrix.api_level }}-${{ github.sha }}
          path: |
            mimi-app/build/reports/androidTests/connected/
            mimi-app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
