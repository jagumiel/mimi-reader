name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Test CI preparation helpers
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Generate and verify release SBOM
        run: >-
          ./gradlew --no-daemon --stacktrace
          verifySbom testSbomValidation

      - name: Build and verify debug
        run: >-
          ./gradlew --no-daemon --stacktrace
          :mimi-app:verifyApplicationVariants
          :mimi-app:testDebugUnitTest
          :chanlib:testDebugUnitTest
          :mimi-app:lintDebug
          :mimi-app:assembleDebug

      - name: Build minified release artifacts
        run: >-
          ./gradlew --no-daemon --stacktrace
          :mimi-app:assembleRelease
          :mimi-app:bundleRelease

      - name: Generate release checksums
        run: >-
          sha256sum
          mimi-app/build/outputs/apk/release/*.apk
          mimi-app/build/outputs/bundle/release/*.aab
          > mimi-app/build/outputs/release-checksums.txt

      - name: Verify native ELF and APK alignment
        run: |
          python3 scripts/ci/android_native.py mimi-app/build/outputs/apk/debug/mimi-app-debug.apk --report build/reports/native-alignment/debug.json
          python3 scripts/ci/android_native.py mimi-app/build/outputs/apk/release/mimi-app-release-unsigned.apk --report build/reports/native-alignment/release.json --r8-seeds mimi-app/build/outputs/mapping/release/seeds.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 mimi-app/build/outputs/apk/release/mimi-app-release-unsigned.apk

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports-${{ github.sha }}
          path: |
            mimi-app/build/reports/
            chanlib/build/reports/
            mimi-app/build/test-results/
            chanlib/build/test-results/
            build/reports/native-alignment/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mimi-reader-debug-${{ github.sha }}
          path: mimi-app/build/outputs/apk/debug/mimi-app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release SBOM and dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mimi-reader-sbom-${{ github.sha }}
          path: |
            build/reports/sbom/*.json
            sbom/manual-components.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mimi-reader-release-unsigned-${{ github.sha }}
          path: |
            mimi-app/build/outputs/apk/release/*.apk
            mimi-app/build/outputs/bundle/release/*.aab
            mimi-app/build/outputs/mapping/release/mapping.txt
            mimi-app/build/outputs/release-checksums.txt
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests (Android ${{ matrix.android_version }}, API ${{ matrix.api_level }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_version: 10
            api_level: 29
          - android_version: 12
            api_level: 31
          - android_version: 14
            api_level: 34
          - android_version: 16
            api_level: 36

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Android SDK and emulator image
        run: bash scripts/ci/install_emulator_sdk.sh '${{ matrix.api_level }}'

      - name: Prepare pinned API 29 test WebView
        if: matrix.api_level == 29
        run: python3 scripts/ci/android_webview.py download --apk "$RUNNER_TEMP/ci-webview.apk"

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          script: python3 scripts/ci/android_webview.py test --api '${{ matrix.api_level }}' --apk "$RUNNER_TEMP/ci-webview.apk"

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-api-${{ matrix.api_level }}-${{ github.sha }}
          path: |
            mimi-app/build/reports/androidTests/connected/
            mimi-app/build/outputs/androidTest-results/connected/
            build/reports/legacy-webview/
          if-no-files-found: warn
          retention-days: 14

  native-16k-tests:
    name: Native media (Android 16, 16 KB pages)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Prepare 16 KB emulator image
        run: bash scripts/ci/install_emulator_sdk.sh 36 google_apis_ps16k
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual 16 KB native rendering without backcompat
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          script: python3 scripts/ci/android_native.py --test-16k emulator-5554
      - name: Upload native media test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-16k-${{ github.sha }}
          path: |
            mimi-app/build/reports/androidTests/connected/
            mimi-app/build/outputs/androidTest-results/connected/
            build/reports/native-16k/
          if-no-files-found: warn
          retention-days: 14
