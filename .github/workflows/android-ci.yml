name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build and verify freeDebug
        run: >-
          ./gradlew --no-daemon --stacktrace
          :mimi-app:testFreeDebugUnitTest
          :mimi-app:lintFreeDebug
          :mimi-app:assembleFreeDebug

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports-${{ github.sha }}
          path: |
            mimi-app/build/reports/
            chanlib/build/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload freeDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: mimi-reader-free-debug-${{ github.sha }}
          path: mimi-app/build/outputs/apk/free/debug/mimi-app-free-debug.apk
          if-no-files-found: error
          retention-days: 14
