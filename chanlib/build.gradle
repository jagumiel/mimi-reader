apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.mimireader.chanlib'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}

dependencies {
    testImplementation "junit:junit:$junit_version"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:$desugar_jdk_libs_version"

    api "com.squareup.retrofit2:retrofit:$retrofit_version"
    // Public connector/builder signatures expose OkHttp types. Do not inherit
    // Retrofit's older minimum when this library is built/tested on its own.
    api "com.squareup.okhttp3:okhttp:$okhttp_version"
    // These factories are internal builder details, not public signature types.
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"

    api "com.google.code.gson:gson:$gson_version"

    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofit_version"
    api "io.reactivex.rxjava2:rxjava:$rxjava_version"

    // ArchiveConverter exposes @NonNull, but no library code uses AndroidX
    // Core/KTX or Android schedulers. This is the app's existing selection.
    api "androidx.annotation:annotation:$annotation_version"
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}

def verifyDependencyBoundary = tasks.register('verifyDependencyBoundary') {
    group = 'verification'
    description = 'Check the standalone connector API/runtime graph without application dependency overrides.'
    doLast {
        def expected = ['com.squareup.okhttp3:okhttp': okhttp_version,
                        'androidx.annotation:annotation': annotation_version]
        def publicModules = (expected.keySet() + ['com.squareup.retrofit2:retrofit',
                'com.google.code.gson:gson', 'io.reactivex.rxjava2:rxjava',
                'org.jetbrains.kotlin:kotlin-stdlib']) as Set
        def privateModules = ['com.squareup.retrofit2:converter-gson',
                              'com.squareup.retrofit2:adapter-rxjava2'] as Set
        def forbidden = ['androidx.core:core', 'androidx.core:core-ktx',
                         'io.reactivex.rxjava2:rxandroid', 'org.jsoup:jsoup'] as Set
        def exported = configurations.api.dependencies.collect { "$it.group:$it.name".toString() } as Set
        if (exported != publicModules) {
            throw new GradleException("Unexpected chanlib API ownership: $exported")
        }
        def internal = configurations.implementation.dependencies
                .collect { "$it.group:$it.name".toString() } as Set
        if (!internal.containsAll(privateModules)) {
            throw new GradleException("Missing chanlib internal factories: $internal")
        }
        ['debugCompileClasspath', 'releaseCompileClasspath', 'debugRuntimeClasspath',
         'releaseRuntimeClasspath', 'debugUnitTestRuntimeClasspath'].each { name ->
            def selected = configurations.getByName(name).incoming.resolutionResult.allComponents
                    .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                    .collectEntries { [("${it.id.group}:${it.id.module}".toString()): it.id.version] }
            expected.each { module, version ->
                if (selected[module] != version) {
                    throw new GradleException("$name must select $module:$version, got ${selected[module]}")
                }
            }
            def unexpected = selected.keySet().intersect(forbidden)
            if (unexpected) throw new GradleException("$name leaks application dependencies: $unexpected")
            logger.lifecycle("chanlib boundary verified: $name")
        }
    }
}
// Existing CI runs the library unit suite; verify the graph there as well as in check.
tasks.withType(Test).configureEach { dependsOn verifyDependencyBoundary }
tasks.named('check') { dependsOn verifyDependencyBoundary }
