// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.3.21'
    ext.room_version = "2.8.5"
    ext.lifecycle_version = "2.11.0"
    ext.kotlinx_serialization_version = "1.8.1"
    ext.rxjava_version = '2.2.21'
    ext.junit_version = '4.13.2'
    ext.gson_version = "2.14.0"
    ext.jsoup_version = "1.23.2"
    ext.desugar_jdk_libs_version = "2.1.5"
    ext.okhttp_version = "4.12.0"
    ext.retrofit_version = "2.11.0"
    ext.appcompat_version = '1.8.0'
    ext.fragment_version = '1.9.1'
    ext.preference_version = '1.2.1'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'org.cyclonedx.bom' version '3.5.1'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
}

apply from: 'gradle/sbom.gradle'
