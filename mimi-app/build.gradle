apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def appVersionCode = providers.gradleProperty('mimiVersionCode').getOrElse('230').toInteger()
def appVersionName = providers.gradleProperty('mimiVersionName').getOrElse('7.0.1')
if (appVersionCode < 1 || appVersionName.trim().isEmpty()) {
    throw new GradleException('mimiVersionCode must be positive and mimiVersionName must not be empty.')
}

def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
def releaseSigningProperties = new Properties()
def releaseSigningConfigured = releaseSigningPropertiesFile.isFile()
if (releaseSigningConfigured) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
    def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missingSigningProperties = requiredSigningProperties.findAll {
        !releaseSigningProperties.getProperty(it)?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException("Missing release signing properties: ${missingSigningProperties.join(', ')}")
    }
}

android {
    namespace 'com.emogoth.android.phone.mimi'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36

        versionCode appVersionCode
        versionName appVersionName

        applicationId "com.emogoth.android.phone.mimi"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation":"$projectDir/schemas".toString(),
                        "room.incremental":"true",
                        "room.expandProjection":"true"
                ]
            }
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
        }
        if (releaseSigningConfigured) {
            release {
                def configuredStoreFile = new File(releaseSigningProperties.getProperty('storeFile'))
                storeFile configuredStoreFile.isAbsolute()
                        ? configuredStoreFile
                        : rootProject.file(configuredStoreFile.path)
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField "boolean", "SHOW_ALL_BOARDS", "true"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            debuggable false
            zipAlignEnabled true
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            applicationIdSuffix '.beta'
            versionNameSuffix ' (DEBUG)'
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "SHOW_ALL_BOARDS", "true"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt', 'proguard-rules-debug.txt'
            minifyEnabled false
            shrinkResources false
            debuggable true
            zipAlignEnabled true
        }
    }

    packagingOptions {
        exclude 'LICENSE.txt'
        exclude 'NOTICE.txt'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

// Product flavors are gone, but existing installations must keep their identity.
def applicationVariantIds = objects.mapProperty(String, String)
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    applicationVariantIds.put(variant.name, variant.applicationId)
}
def verifyApplicationVariants = tasks.register('verifyApplicationVariants') {
    group = 'verification'
    description = 'Verify the single-app debug/release variants retain their existing application IDs.'
    inputs.property('applicationIds', applicationVariantIds)
    doLast {
        def expected = [debug: 'com.emogoth.android.phone.mimi.beta',
                        release: 'com.emogoth.android.phone.mimi']
        def actual = inputs.properties.applicationIds
        if (actual != expected) {
            throw new GradleException("Unexpected application variants/IDs: $actual; expected $expected")
        }
        logger.lifecycle("Application variants verified: $actual")
    }
}
tasks.named('check') { dependsOn verifyApplicationVariants }

