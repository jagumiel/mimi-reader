apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def appVersionCode = providers.gradleProperty('mimiVersionCode').get().toInteger()
def appVersionName = providers.gradleProperty('mimiVersionName').get()
if (appVersionCode < 1 || appVersionName.trim().isEmpty()) {
    throw new GradleException('mimiVersionCode must be positive and mimiVersionName must not be empty.')
}

def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
def releaseSigningProperties = new Properties()
def releaseSigningConfigured = releaseSigningPropertiesFile.isFile()
if (releaseSigningConfigured) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
    def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missingSigningProperties = requiredSigningProperties.findAll {
        !releaseSigningProperties.getProperty(it)?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException("Missing release signing properties: ${missingSigningProperties.join(', ')}")
    }
}

android {
    namespace 'com.emogoth.android.phone.mimi'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36

        versionCode appVersionCode
        versionName appVersionName

        // Independent fork: coexist with the original app and its signing key.
        // Keep the Java/Kotlin namespace unchanged; it is not an install identity.
        applicationId "io.github.jagumiel.mimireader"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation":"$projectDir/schemas".toString(),
                        "room.incremental":"true",
                        "room.expandProjection":"true"
                ]
            }
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
        }
        if (releaseSigningConfigured) {
            release {
                def configuredStoreFile = new File(releaseSigningProperties.getProperty('storeFile'))
                storeFile configuredStoreFile.isAbsolute()
                        ? configuredStoreFile
                        : rootProject.file(configuredStoreFile.path)
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField "boolean", "SHOW_ALL_BOARDS", "true"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            debuggable false
            zipAlignEnabled true
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            applicationIdSuffix '.beta'
            versionNameSuffix ' (DEBUG)'
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "SHOW_ALL_BOARDS", "true"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt', 'proguard-rules-debug.txt'
            minifyEnabled false
            shrinkResources false
            debuggable true
            zipAlignEnabled true
        }
    }

    packagingOptions {
        exclude 'LICENSE.txt'
        exclude 'NOTICE.txt'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

// Keep fork variants separate from legacy apps and their public test key.
def applicationVariantIds = objects.mapProperty(String, String)
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    applicationVariantIds.put(variant.name, variant.applicationId)
}
def verifyApplicationVariants = tasks.register('verifyApplicationVariants') {
    group = 'verification'
    description = 'Verify the independent fork debug/release installation identities.'
    inputs.property('applicationIds', applicationVariantIds)
    doLast {
        def expected = [debug: 'io.github.jagumiel.mimireader.beta',
                        release: 'io.github.jagumiel.mimireader']
        def actual = inputs.properties.applicationIds
        if (actual != expected) {
            throw new GradleException("Unexpected application variants/IDs: $actual; expected $expected")
        }
        logger.lifecycle("Application variants verified: $actual")
    }
}
tasks.named('check') { dependsOn verifyApplicationVariants }

dependencies {
    implementation project(':chanlib')
    // Lifecycle saved-state uses Serialization transitively; align runtime/test versions.
    implementation platform("org.jetbrains.kotlinx:kotlinx-serialization-bom:$kotlinx_serialization_version")
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:$desugar_jdk_libs_version"

    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    // Own the Fragment baseline instead of inheriting an old transitive alpha.
    implementation "androidx.fragment:fragment:$fragment_version"
    implementation "androidx.core:core:1.18.0"
    implementation "androidx.core:core-ktx:1.18.0"
    // Declare actual code/XML consumers instead of the legacy support umbrellas.
    // Modernize remaining consumer families in bounded, separately tested changes.
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.0.0'
    implementation 'androidx.slidingpanelayout:slidingpanelayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.browser:browser:1.2.0'
    // 1.15.0 is the newest WebKit release that keeps this app's minSdk 23.
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    // Stable Material baseline retains minSdk 23 and the existing MaterialComponents themes.
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation "androidx.annotation:annotation:$annotation_version"
    implementation "androidx.preference:preference:$preference_version"
    // Material 1.14.0 already requires 2.2.1; own the gallery's actual baseline.
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation 'com.github.franmontiel:PersistentCookieJar:1.0.1'
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.google.code.gson:gson:$gson_version"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofit_version"
    implementation "io.reactivex.rxjava2:rxjava:$rxjava_version"
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation "org.jsoup:jsoup:$jsoup_version"
    // Fix CVE-2025-48924 while preserving numeric/Long parser contracts (see docs/COMMONS_LANG.md).
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.32'
    def media3_version = "1.10.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    // 5.0.9 requires compileSdk 37; 5.0.7 retains our tested SDK 36 baseline.
    def glide_version = '5.0.7'
    implementation "com.github.bumptech.glide:okhttp3-integration:$glide_version"
    implementation "com.github.bumptech.glide:glide:$glide_version"
    // Still required for AppGlideModule/OkHttp registration, not the deprecated GlideApp API.
    kapt "com.github.bumptech.glide:compiler:$glide_version"

    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'

    def work_version = "2.10.5"

    // Owns both Java APIs and the workDataOf/request-builder Kotlin functions.
    implementation "androidx.work:work-runtime:$work_version"

    // optional - RxJava2 support
    implementation "androidx.work:work-rxjava2:$work_version"


    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version" // For Kotlin use kapt instead of annotationProcessor

    // optional - RxJava support for Room
    implementation "androidx.room:room-rxjava2:$room_version"

    // Test helpers
    testImplementation "junit:junit:$junit_version"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttp_version"
    testImplementation "androidx.room:room-testing:$room_version"
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation "androidx.room:room-testing:$room_version"

    implementation 'com.github.martin-stone:hsv-alpha-color-picker-android:3.0.1'
    // API-compatible maintained fork with rebuilt 16 KB-aligned Pdfium binaries.
    implementation 'io.github.oothp:android-pdf-viewer:3.2.0-beta06'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
